<!DOCTYPE html> 
<html lang="de"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <title>Jonatan's Portfolio</title> 
    <link rel="shortcut icon" href="../../../img/jp.png"> 

    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet"> 
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet"> 
    
    <link rel="stylesheet" href="../../../global-assets/css/global.css">
    <link rel="stylesheet" href="style.css">

</head> 
<body>

    <div class="nebula-bg">
        <div class="nebula-layer layer-1"></div>
        <div class="nebula-layer layer-2"></div>
        <div class="nebula-layer layer-3"></div>
        <div class="nebula-layer layer-4"></div>
        <div class="nebula-layer layer-5"></div>
        <div class="nebula-layer layer-6"></div>
    </div>

    <div class="space-objects"></div>
    <div class="comet-container"></div>

    <div class="floating-lights"></div> 

    <!-- Last.fm Widget -->
    <div class="lastfm-handle" id="lastfm-handle"></div>
    <div class="lastfm-widget" id="lastfm-widget">
        <div class="lastfm-content">
            <img id="track-image" src="" alt="Album cover">
            <div class="track-info">
                <div class="track-details">
                    <a id="track-link" href="#" target="_blank"><span id="track-name">Lade…</span></a>
                    <span id="track-artist">-</span>
                </div>
                <div id="status-label" class="status">-</div>
            </div>
        </div>
    </div>

    <button class="menu-toggle menu-button"> 
        <img src="../img/menu.png" alt="menu" class="toggle-icon menu-icon"> 
    </button> 

    <div class="overlay nav-overlay"> 
        <nav class="mobile-nav"> 
            <a href="../../../index.html">Home</a>
            <a href="../../projects/site.html">Projects</a> 
            <a href="../../about/site.html">About me</a> 
            <a href="../../index.html#socials">Socials</a> 
            <a href="../../sitemap/site.html">Sitemap</a> 
        </nav> 
    </div>
    

    <button class="settings-button"> 
        <img src="img/settings.png" alt="settings" class="settings-icon toggle-icon"> 
    </button> 

    <div class="overlay settings-overlay"> 
        <nav class="mobile-nav"> 
            <h2>Settings</h2>
            
            <!-- Preset Themes -->
            <div class="theme-section">
                <h3>Preset Themes</h3>
                <div class="theme-container">
                    <label class="theme-option">
                        <input type="radio" name="theme" id="deep-sea">
                        <span>Deep Sea</span>
                        <div class="color-dots">
                            <span style="background: #48cae4;"></span>
                            <span style="background: #023e8a;"></span>
                            <span style="background: #010214;"></span>
                        </div>
                    </label>

                    <label class="theme-option">
                        <input type="radio" name="theme" id="aqua-laguna">
                        <span>Aqua Laguna</span>
                        <div class="color-dots">
                            <span style="background: #00FFEF;"></span>
                            <span style="background: #006D66;"></span>
                            <span style="background: #001F1D;"></span>
                        </div>
                    </label>

                    <label class="theme-option">
                        <input type="radio" name="theme" id="jungle">
                        <span>Jungle</span>
                        <div class="color-dots">
                            <span style="background: yellow;"></span>
                            <span style="background: #318145;"></span>
                            <span style="background: #01282b;"></span>
                        </div>
                    </label>

                    <label class="theme-option">
                        <input type="radio" name="theme" id="bloodbath">
                        <span>Bloodbath</span>
                        <div class="color-dots">
                            <span style="background: #ff4040;"></span>
                            <span style="background: #800000;"></span>
                            <span style="background: #100000;"></span>
                        </div>
                    </label>

                    <label class="theme-option">
                        <input type="radio" name="theme" id="nebula">
                        <span>Nebula</span>
                        <div class="color-dots">
                            <span style="background: #bd00ff;"></span>
                            <span style="background: #140a1f;"></span>
                            <span style="background: #000;"></span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Custom Colors -->
            <div class="theme-section">
                <h3>Custom Colors</h3>
                <div class="custom-color-container">
                    
                    <div class="color-picker-row">
                        <label for="custom-accent">Accent Color:</label>
                        <div class="color-input-group">
                            <input type="color" id="custom-accent" value="#b40000">
                            <input type="text" id="custom-accent-hex" placeholder="#b40000" maxlength="7">

                        </div>
                    </div>

                    <div class="color-picker-row">
                        <label for="custom-bg1">Background 1:</label>
                        <div class="color-input-group">
                            <input type="color" id="custom-bg1" value="#1a1a1b">
                            <input type="text" id="custom-bg1-hex" placeholder="#1a1a1b" maxlength="7">
                        </div>
                    </div>

                    <div class="color-picker-row">
                        <label for="custom-bg2">Background 2:</label>
                        <div class="color-input-group">
                            <input type="color" id="custom-bg2" value="#000000">
                            <input type="text" id="custom-bg2-hex" placeholder="#000000" maxlength="7">
                        </div>
                    </div>

                    <button id="apply-custom" class="apply-btn">Apply Custom Colors</button>
                </div>
            </div>

            <!-- Particles Toggle -->
                <div class="theme-section">
                    <h3>Particles</h3>
                    <div class="toggle-container">
                        <label class="toggle-option">
                            <span>All</span>
                            <div class="toggle-switch">
                                <input type="checkbox" id="particles-all-toggle" checked>
                                <span class="toggle-slider"></span>
                            </div>
                        </label>
                        <label class="toggle-option">
                            <span>Floating Lights</span>
                            <div class="toggle-switch">
                                <input type="checkbox" id="floating-lights-toggle" checked>
                                <span class="toggle-slider"></span>
                            </div>
                        </label>
                        <label class="toggle-option">
                            <span>Comets</span>
                            <div class="toggle-switch">
                                <input type="checkbox" id="comets-toggle" checked>
                                <span class="toggle-slider"></span>
                            </div>
                        </label>
                        <label class="toggle-option">
                            <span>Planets</span>
                            <div class="toggle-switch">
                                <input type="checkbox" id="planets-toggle" checked>
                                <span class="toggle-slider"></span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
        </nav> 
    </div>


    <main class="casino-container">
        <header class="casino-header">
            <h1>Flexo Roulette</h1>
            <div class="balance-display">Balance: <span id="balance">1000</span>$</div>
        </header>

        <div class="roulette-wheel-area">
            <div id="wheel-result">?</div>
            <p id="status-text">Place your bets!</p>
        </div>

        <div class="betting-table">
            <div class="bet-options">
                <button class="bet-btn red" data-bet="red">Red (R)</button>
                <button class="bet-btn green" data-bet="0">Green (G)</button>
                <button class="bet-btn black" data-bet="black">Black (B)</button>
            </div>
            
            <div class="bet-amount-selector">
                <label>Bet Amount:</label>
                <input type="number" id="bet-amount" value="100" min="0" step="100">
            </div>

            <button id="spin-btn" class="main-spin-btn">SPIN (S / Enter)</button>
        </div>
    </main>

    
    <footer>
        <p>&copy; 2026 Jonatan Przewlocki. All rights reserved.</p>
        <p>This website is open source on <a href="https://github.com/FlexoRaid" target="_blank">GitHub</a>.</p>
    </footer>

    <button id="admin-trigger" class="admin-btn">
        <img src="../../../img/cash.png" alt="admin" class="admin-icon">
    </button>

    <div id="admin-overlay" class="overlay">
        <div class="admin-panel">
            <h2 id="admin-title">Security Check</h2>
            <div id="step-password">
                <input type="password" id="admin-pw" maxlength="6" placeholder="******">
                <button onclick="checkAdminPw()" class="main-spin-btn" style="padding: 10px 30px; margin-top: 15px; width: auto; display: inline-block;">Verify</button>
            </div>
            <div id="step-money" style="display: none;">
                <p>Enter Amount:</p>
                <input type="number" id="money-amount" placeholder="99999" min="0" step="1000">
                <button onclick="addMoney()" class="main-spin-btn" style="padding: 10px 30px; margin-top: 15px; width: auto; display: inline-block;">Add Money</button>
            </div>
            <button class="close-admin" onclick="closeAdmin()">Close</button>
        </div>
    </div>

    <script src="../../../global-assets/js/global.js"></script>
    <script src="script.js" defer></script>
</body>
</html>

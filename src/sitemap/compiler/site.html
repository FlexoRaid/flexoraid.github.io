<!DOCTYPE html> 
<html lang="de"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

    <title>Jonatan's Portfolio</title> 
    <link rel="shortcut icon" href="../../../img/jp.png"> 

    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet"> 
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet"> 
    
    <link rel="stylesheet" href="../../../global-assets/css/global.css">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head> 
<body>

    <button class="menu-toggle menu-button"> 
        <img src="../img/menu.png" alt="menu" class="toggle-icon menu-icon"> 
    </button> 

    <div class="overlay nav-overlay"> 
        <nav class="mobile-nav"> 
            <a href="../../../index.html">Home</a>
            <a href="../../projects/site.html">Projects</a> 
            <a href="../../about/site.html">About me</a> 
            <a href="../../index.html#socials">Socials</a> 
            <a href="../../sitemap/site.html">Sitemap</a> 
        </nav> 
    </div>
    

    <button class="settings-button"> 
        <img src="img/settings.png" alt="settings" class="settings-icon toggle-icon"> 
    </button> 

    <div class="overlay settings-overlay"> 
        <nav class="mobile-nav"> 
            <h2>Settings</h2>
            
            <!-- Preset Themes -->
            <div class="theme-section">
                <h3>Preset Themes</h3>
                <div class="theme-container">
                    <label class="theme-option">
                        <input type="radio" name="theme" id="deep-sea">
                        <span>Deep Sea</span>
                        <div class="color-dots">
                            <span style="background: #48cae4;"></span>
                            <span style="background: #023e8a;"></span>
                            <span style="background: #010214;"></span>
                        </div>
                    </label>

                    <label class="theme-option">
                        <input type="radio" name="theme" id="aqua-laguna">
                        <span>Aqua Laguna</span>
                        <div class="color-dots">
                            <span style="background: #00FFEF;"></span>
                            <span style="background: #006D66;"></span>
                            <span style="background: #001F1D;"></span>
                        </div>
                    </label>

                    <label class="theme-option">
                        <input type="radio" name="theme" id="jungle">
                        <span>Jungle</span>
                        <div class="color-dots">
                            <span style="background: yellow;"></span>
                            <span style="background: #318145;"></span>
                            <span style="background: #01282b;"></span>
                        </div>
                    </label>

                    <label class="theme-option">
                        <input type="radio" name="theme" id="bloodbath">
                        <span>Bloodbath</span>
                        <div class="color-dots">
                            <span style="background: #ff4040;"></span>
                            <span style="background: #800000;"></span>
                            <span style="background: #100000;"></span>
                        </div>
                    </label>

                    <label class="theme-option">
                        <input type="radio" name="theme" id="nebula">
                        <span>Nebula</span>
                        <div class="color-dots">
                            <span style="background: #bd00ff;"></span>
                            <span style="background: #140a1f;"></span>
                            <span style="background: #000;"></span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Custom Colors -->
            <div class="theme-section">
                <h3>Custom Colors</h3>
                <div class="custom-color-container">
                    
                    <div class="color-picker-row">
                        <label for="custom-accent">Accent Color:</label>
                        <div class="color-input-group">
                            <input type="color" id="custom-accent" value="#b40000">
                            <input type="text" id="custom-accent-hex" placeholder="#b40000" maxlength="7">

                        </div>
                    </div>

                    <div class="color-picker-row">
                        <label for="custom-bg1">Background 1:</label>
                        <div class="color-input-group">
                            <input type="color" id="custom-bg1" value="#1a1a1b">
                            <input type="text" id="custom-bg1-hex" placeholder="#1a1a1b" maxlength="7">
                        </div>
                    </div>

                    <div class="color-picker-row">
                        <label for="custom-bg2">Background 2:</label>
                        <div class="color-input-group">
                            <input type="color" id="custom-bg2" value="#000000">
                            <input type="text" id="custom-bg2-hex" placeholder="#000000" maxlength="7">
                        </div>
                    </div>

                    <button id="apply-custom" class="apply-btn">Apply Custom Colors</button>
                </div>
            </div>

            </div>
        </nav> 
    </div>

    <div id="orientation-overlay">
        <div class="overlay-content">
            <div class="phone-icon"></div>
            <p>
                Please rotate your device to continue.<br>
                But for the best experience, I recommend using a desktop or laptop computer.
            </p>
        </div>
    </div>


    <div class="compiler-main-container">
        <aside class="language-sidebar">
            <div class="lang-icon active" data-lang="js">
                <img src="../../../img/js.png" alt="JS">
            </div>
            <div class="lang-icon" data-lang="py">
                <img src="../../../img/python.png" alt="Python">
            </div>
            <div class="lang-icon" data-lang="html">
                <img src="../../../img/html.png" alt="HTML">
            </div>
        </aside>

        <main class="compiler-content">
            <section class="editor-section">
                <div class="editor-header">
                    <div class="file-tabs" id="fileTabs"></div>
                    <button id="runBtn" class="run-button">Run</button>
                </div>
                <textarea id="codeInput" class="code-editor" spellcheck="false"></textarea>
            </section>
            
            <section class="output-section">
                <div class="output-header">
                    <h3>Output</h3>
                    <button id="clearBtn" class="clear-button">Clear</button>
                </div>
                <div id="outputConsole" class="output-console">
                    <iframe id="htmlPreview" class="html-preview" style="display:none;"></iframe>
                    <div id="consoleText"></div>
                </div>
            </section>
        </main>

        <aside class="right-sidebar"></aside>
    </div>

    <script src="../../../global-assets/js/global.js"></script>
    <script src="script.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jonatan's Weather App</title>
    <link rel="icon" type="image/png" href="../icons/jp.png">
    <link rel="shortcut icon" href="../icons/jp.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="weather.css">
</head>
<body>

    <div class="floating-lights"></div>

    <button id="menu-toggle" class="menu-button">
        <img src="../icons/menu.png" alt="menu" id="toggle-icon" class="menu-icon">
    </button>

    <div id="nav-overlay" class="overlay">
        <nav class="mobile-nav">
            <a href="../index.html">Home</a>
            <a href="../about/about.html">About Me</a>
            <a href="../projects/projects.html">Projects</a>
            <a href="../index.html#socials">Socials</a>
            <a href="../sitemap/sitemap.html">Sitemap</a>
        </nav>
    </div>

    <main class="content-wrapper">
        <div class="card weather-card">
            
            <header class="input-container">
                <input class="city-input" type="text" placeholder="Search City...">
                <button class="search-btn">
                    <img class="icon search-icon-white" src="../icons/search.svg" alt="search">
                </button>
            </header>

            <section class="current-weather">
                <div class="location-info">
                    <div class="loc-row">
                        <img src="../icons/location.svg" class="loc-pin white-icon" alt="loc">
                        <h2 class="country-txt">Munich</h2>
                    </div>
                    <p class="sub-text" id="date">--</p>
                </div>

                <div class="main-display">
                    <img src="../icons/Clouds.svg" alt="weather" class="weather-icon-main">
                    <div class="temp-wrap">
                        <h1 id="Temperature">-- °C</h1>
                        <p class="weather-desc" id="weather-type">--</p>
                    </div>
                </div>

                <div class="stats-container">
                    <div class="mini-stat">
                        <img src="../icons/Humidity_Icon.svg" alt="Hum">
                        <div class="stat-text">
                            <span class="label">Humidity</span>
                            <span id="Humidity-proc">--%</span>
                        </div>
                    </div>
                    <div class="mini-stat">
                        <img src="../icons/Air-Icon.svg" alt="Wind">
                        <div class="stat-text">
                            <span class="label">Wind Speed</span>
                            <span id="Wind-speed">-- M/s</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="forecast-section">
                <div class="forecast-grid" id="forecast-wrapper">
                </div>
            </section>

        </div>
    </main>

    <script src="weather.js" defer></script>
</body>
</html>
